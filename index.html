function audioFor(file){if(!audioCache.has(file)){const a=new Audio(encodeURI(file));a.preload='auto';audioCache.set(file,a)}return audioCache.get(file)}
function pick(group){const a=SOUND_GROUPS[group]||[];if(!a.length)return null;cycles[group]=(cycles[group]||0)%a.length;return a[cycles[group]++];}
function play(group,vol=.7,loop=false){if(!audioEnabled)return null;const f=pick(group);if(!f)return null;const a=audioFor(f);try{if(loop&&loops.has(group))return loops.get(group);if(!loop){a.pause();a.currentTime=0}a.volume=Math.max(0,Math.min(1,vol));a.loop=loop;a.play().catch(()=>{});if(loop)loops.set(group,a);return a}catch(e){return null}}

function consume(toChild){const item=state.holding;if(!item||!FOOD_RE.test(item))return false;const drink=DRINK_RE.test(item);state.holding=null;if(toChild){const group=state.child.age<1&&drink?'babyDrink':drink?'drink':'eat';const a=play(group,.62,true);state.child.activity=drink?'drinking':'eating';toast(`${state.child.name} starts ${state.child.activity}.`);setTimeout(()=>{if(a){a.pause();a.currentTime=0}stopActionSounds();const r=Math.random();if(r<.16){play('burp',.65);state.child.need='winding';state.child.activity='stopped after burping'}else if(r<.26){play('spit',.62);state.child.hygiene=Math.max(0,state.child.hygiene-20);state.child.need='cleaning';state.child.activity='stopped after being sick'}else{state.child.hunger=Math.max(0,state.child.hunger-(drink?8:36));state.child.thirst=Math.max(0,state.child.thirst-(drink?42:8));state.child.activity='finished'}render()},2600)}else{play(drink?'drink':'eat',.62);state.player.hunger=Math.max(0,state.player.hunger-(drink?5:35));state.player.thirst=Math.max(0,state.player.thirst-(drink?40:5));toast(`You ${drink?'drink':'eat'} the ${item.toLowerCase()}.`)}render();return true}

function bathroom(o){let r=state.player.routine;if(/Toilet$|Potty$/.test(o)){if(!r){state.player.routine={type:'toilet',step:1};play(state.player.toilet>70?'poo':'pee',.55);toast('You lower your clothes and use the toilet.')}else if(r.type==='toilet'&&r.step===1){r.step=2;toast('Use the toilet roll holder.')}return render()}if(o==='Toilet roll holder'&&r?.type==='toilet'&&r.step===2){r.step=3;toast('You clean yourself and adjust your clothes. Return to the toilet to flush.');return render()}if(/Toilet$/.test(o)&&r?.type==='toilet'&&r.step===3){play('flush');r.step=4;toast('You flush. Move to the sink.');return render()}if(/Sink$/.test(o)||o==='Utility sink'||o==='Craft sink'||o==='Boot room sink'){play('tap',.5);if(r?.type==='toilet'&&r.step===4){r.step=5;toast('You wash with soap. Move to a towel.')}else{state.player.hygiene=Math.min(100,state.player.hygiene+15);toast('You run the tap, wash and rinse.')}return render()}if(/Towel rail|Towel$|Towel basket|towel basket/i.test(o)){if(r?.type==='toilet'&&r.step===5){state.player.routine=null;state.player.toilet=0;toast('You dry your hands.')}else if(r&&['bath','shower'].includes(r.type)&&r.step>=6){state.player.routine=null;state.player.hygiene=100;toast('You dry yourself and get dressed.')}else take('Towel');return render()}if(/Shower$/.test(o)){if(!r){state.player.routine={type:'shower',step:1};toast('Collect a towel, shampoo and soap.')}else if(r.type==='shower'&&r.step===4){play('shower',.45,true);r.step=5;toast('You turn on the shower, check the water and step in.')}else if(r.type==='shower'&&r.step===5){r.step=6;stop('shower');toast('You wash, rinse, turn the water off and step out. Use the towel rail.')}return render()}if(o==='Bath'){if(!r){state.player.routine={type:'bath',step:1};toast('Collect a towel, soap and shampoo.')}else if(r.type==='bath'&&r.step===4){play('bathFill',.5);r.step=5;toast('You fill the bath and check the water.')}else if(r.type==='bath'&&r.step===5){play('waterGentle',.3,true);r.step=6;toa // Doors are handled before ACTIONS. Every listed object must now be covered by a link, storage or action.
function validateActions(){const missing=ALL_OBJECTS.filter(o=>!LINKS[o]&&!CATALOGS[o]&&!ACTIONS[o]);if(missing.length)throw new Error('Missing object actions: '+missing.join(', '));}
function interact(){interruptSpeech();const o=current();if(state.open){const a=CATALOGS[state.open],item=a[state.openIndex%a.length];closeContainer();take(item);return}if(LINKS[o]){const p=LINKS[o],dest=p[0]===state.room?p[1]:p[0];return enter(dest,o)}if(state.holding&&o==='Your child')return childInteract();if(state.holding&&o==='You')return useOnSelf(state.holding);if(state.holding&&CATALOGS[o]){toast(`You return ${state.holding.toLowerCase()} to the ${o.toLowerCase()}.`);state.holding=null;return render()}if(CATALOGS[o])return openContainer(o);const fn=ACTIONS[o];if(!fn)throw new Error('No action for '+o);fn(o);render()}
function childAI(){if(!started||state.child.state==='asleep'||state.child.carried||state.child.inPram)return;const age=state.child.age;const allowed=age<1?['nursery','living','family','playroom']:['playroom','childroom','living','family','garden','kitchen','sensory','music','games'];if(Math.random()<.58){const dest=allowed.filter(x=>x!==state.child.room)[Math.floor(Math.random()*(allowed.length-1))]||allowed[0];state.child.room=dest;state.child.spot='moving';if(age<1){play('crawl',.38);state.child.activity='crawling through the house'}else{play(dest==='garden'?'runGravel':'runIndoor',.48);state.child.activity='running to '+ROOMS[dest][0].toLowerCase()}setTimeout(()=>{const acts=ROOMS[dest][2].filter(x=>ACTIONS[x]&&/toy|play|blocks|railway|doll|puzzle|colour|reading|ball|grass|slide|swing|sand|mud|music|piano|fidget|beanbag|tent/i.test(x));if(acts.length){const a=acts[Math.floor(Math.random()*acts.length)];state.child.spot=a;state.child.activity='using '+a.toLowerCase();play(age<2?'toddlerLaugh':'childLaugh',.4)}render()},1100)}else{const x=Math.random();if(x<.18){state.child.need='hungry';state.child.activity='looking for food';play(age<2?'toddlerShout':'hello',.38)}else if(x<.34){state.child.need='thirsty';state.child.activity='looking for a drink'}else if(x<.48){state.child.need='toilet';state.child.activity='heading towards the bathroom';state.child.room='bathroom'}else if(x<.64){state.child.activity='bringing you a toy';state.child.room=state.room;play('blocks',.3)}else if(x<.78&&age>=2){state.child.activity='taking something they should not';state.child.room='kitchen';play('cupboard',.28)}else{state.child.need='close contact';state.child.activity='coming to find you';state.child.room=state.room;play(age<1?'babble':'toddlerShout',.38)}}render()}
function tick(){if(!started)return;state.minute+=5;if(state.minute>=1440){state.minute-=1440;state.day++;state.child.birthdayProgress++;if(state.child.birthdayProgress>=state.ageDays){state.child.birthdayProgress=0;state.child.age+=1;play('ui');toast(`${state.child.name} is now ${Math.floor(state.child.age)}.`)}state.weather=['Sunny','Cloudy','Rainy','Windy'][Math.floor(Math.random()*4)];ambient()}state.player.hunger=Math.min(100,state.player.hunger+.5);state.player.thirst=Math.min(100,state.player.thirst+.65);state.player.toilet=Math.min(100,state.player.toilet+.45);state.child.hunger=Math.min(100,state.child.hunger+.8);state.child.thirst=Math.min(100,state.child.thirst+.9);state.child.toilet=Math.min(100,state.child.toilet+.7);if(Math.random()<.04)play(['sneeze','cough','fart','squeak'][Math.floor(Math.random()*4)],.38);render()}
